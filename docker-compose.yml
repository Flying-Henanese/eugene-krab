services:
  dexter-gateway:
    build:
      context: .
    image: dexter-gateway:local
    container_name: dexter-gateway
    restart: unless-stopped
    init: true
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./.dexter:/app/.dexter
      - ./gateway.example.json:/app/gateway.example.json:ro
    command: >
      sh -lc "xvfb-run -a bun run gateway"
